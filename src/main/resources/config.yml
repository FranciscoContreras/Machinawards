# ── Database ──────────────────────────────────────────────────────────────────
# type: sqlite  (default, no setup required — data stored in plugins/MachinaWards/MachinaWards.db)
# type: mysql   (requires a MySQL/MariaDB server; fill in credentials below)
database:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: machinawards
    username: root
    password: ""

region:
  shape: column

worlds: []

height:
  min_y: -64
  max_y: 320

alerts:
  enabled: true
  cooldown_ms: 90000
  title_format: "&6Ward alert"
  actionbar_format: "&e%player% entered &f%ward%"

entry:
  show_warning_to_visitor: true
  warning_format: "&c⚠ Entering &f%ward% &c— owned by &f%owner%"

pickup:
  confirm_ms: 5000

protection:
  block_place: true
  block_break: true
  interact: true
  explosion: true
  fire: true
  piston: true        # block pistons from pushing/pulling blocks across ward boundaries
  entity_grief: true  # block enderman, silverfish, wither, ravager, etc. from changing blocks
  fluid_flow: true    # block lava/water from flowing into a ward
  hanging: true       # block non-members from breaking item frames and paintings
  pvp: true           # block outsiders from attacking players inside a ward (per-ward flag: allow_pvp)
  entity_damage: true # block outsiders from damaging animals/mobs inside a ward (per-ward flag: allow_mob_damage)
  crop_trample: true  # block non-members from trampling farmland inside a ward

sounds:
  ward_place: BLOCK_BEACON_ACTIVATE
  ward_break: BLOCK_BEACON_DEACTIVATE
  ward_pickup: ITEM_BUNDLE_REMOVE_ONE
  entry_alert: BLOCK_NOTE_BLOCK_BELL

particles:
  enabled: true
  type: END_ROD
  interval_ticks: 40

wards:
  basic:
    display_name: "&aBasic Ward"
    result_material: LANTERN
    price: 100
    radius: 12
    notify: true
    max_members: 5
    custom_recipe:
      - ["IRON_INGOT", "IRON_INGOT", "IRON_INGOT"]
      - ["IRON_INGOT", "ENDER_EYE", "IRON_INGOT"]
      - ["IRON_INGOT", "LANTERN", "IRON_INGOT"]

  advanced:
    display_name: "&bAdvanced Ward"
    result_material: BEACON
    price: 500
    radius: 20
    notify: true
    max_members: 10
    custom_recipe:
      - ["DIAMOND_BLOCK", "NETHER_STAR", "DIAMOND_BLOCK"]
      - ["OBSIDIAN", "BEACON", "OBSIDIAN"]
      - ["IRON_BLOCK", "IRON_BLOCK", "IRON_BLOCK"]

  super:
    display_name: "&5Super Ward"
    result_material: CRYING_OBSIDIAN
    price: 2500
    radius: 30
    notify: true
    max_members: -1
    features:
      - creeper_alert
      - mob_kills_player
      - mob_kills_entity
      - player_death
      - explosion_log
    custom_recipe:
      - ["OBSIDIAN", "ENDER_EYE", "OBSIDIAN"]
      - ["ENDER_EYE", "CRYING_OBSIDIAN", "ENDER_EYE"]
      - ["OBSIDIAN", "ENDER_EYE", "OBSIDIAN"]
