name: MachinaWards
main: com.machina.wards.MachinaWards
version: 2.0.0
api-version: '26.1'
author: Machina
softdepend: [Vault]
libraries:
  - com.mysql:mysql-connector-j:8.3.0
  - com.zaxxer:HikariCP:6.2.1
commands:
  ward:
    description: Manage wards
    usage: /ward
permissions:
  wards.admin:
    description: Full admin access — bypass all protection, delete any ward
    default: op
  wards.place:
    description: Allows placing ward blocks
    default: true
  wards.player.*:
    description: Wildcard for tier-based ward limits (e.g. wards.player.3)
